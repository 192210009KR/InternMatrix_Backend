<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Internship - InternMatrix</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .admin-sidebar {
            background: var(--white);
            border-right: 1.5px solid var(--border-color);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 48px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .admin-nav-item:hover {
            background: var(--secondary-blue);
            color: var(--primary-blue);
            transform: translateX(4px);
        }

        .admin-nav-item.active {
            background: var(--primary-blue);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(0, 149, 217, 0.2);
        }

        /* Sidebar override to avoid global nav conflict */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        
        /* Sidebar nav override */
        .admin-sidebar .sidebar-nav {
            margin-top: 12px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Override global nav style for sidebar */
        .admin-sidebar nav {
            height: auto;
            flex-direction: column;
            align-items: flex-start;
            padding: 0;
            background: transparent;
            box-shadow: none;
            position: static;
        }

        .admin-content {
            padding: 48px 64px;
            background: var(--bg-light);
            max-width: 1100px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
            margin-top: 32px;
        }

        .form-section {
            padding: 48px;
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(0, 149, 217, 0.05);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 14px 24px;
            border-radius: var(--radius-pill);
            border: 1.5px solid var(--border-color);
            background: var(--white);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group textarea {
            border-radius: 20px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: white;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="index.html" class="logo" style="color: var(--primary-blue);">InternMatrix <span
                    style="font-size: 12px; opacity: 0.6; font-weight: 400; color: var(--text-secondary);">ADMIN</span></a>
            <div class="sidebar-nav">
                <a href="admin-dashboard.html" class="admin-nav-item"><i>🏠</i> Dashboard</a>
                <a href="admin-create-internship.html" class="admin-nav-item active"><i>➕</i> Create Internship</a>
                <a href="admin-manage-internships.html" class="admin-nav-item"><i>📂</i> Manage Internships</a>
                <a href="admin-applications.html" class="admin-nav-item"><i>👥</i> All Applications</a>
                <a href="admin-profile.html" class="admin-nav-item"><i>👤</i> My Profile</a>
            </div>
        </aside>

        <main class="admin-content">
            <h2 style="font-family: 'Outfit'; font-size: 32px;">Launch New Internship</h2>
            <p style="color: var(--text-secondary); margin-top: 8px;">Fill in the details to publish a new opportunity
                for students.</p>

            <form class="form-section card" style="margin-top: 40px;">
                <h4 style="margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
                    Primary Details</h4>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Internship Title</label>
                        <input type="text" id="title" placeholder="e.g. Frontend Developer Intern" required>
                    </div>
                    <div class="input-group">
                        <label>Company Name</label>
                        <input type="text" id="company" placeholder="e.g. Google India" required>
                    </div>
                    <div class="input-group">
                        <label>Work Mode</label>
                        <select id="work_mode">
                            <option>Remote</option>
                            <option>Hybrid</option>
                            <option>On-site</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Duration</label>
                        <input type="text" id="duration" placeholder="e.g. 6 Months" required>
                    </div>
                    <div class="input-group">
                        <label>Stipend (Monthly)</label>
                        <input type="text" id="stipend" placeholder="e.g. 25,000" required>
                    </div>
                    <div class="input-group">
                        <label>Location</label>
                        <input type="text" id="location" placeholder="e.g. Bangalore / Remote" required>
                    </div>
                    <div class="input-group">
                        <label>Skills Required (comma separated)</label>
                        <input type="text" id="skills" placeholder="e.g. Java, Python, React" required>
                    </div>
                    <div class="input-group">
                        <label>Application Deadline</label>
                        <input type="date" id="deadline" required>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 16px;">
                    <label>Role Description</label>
                    <textarea id="description" style="height: 160px;"
                        placeholder="Describe the responsibilities, requirements, and benefits..." required></textarea>
                </div>

                <div style="display: flex; gap: 16px; margin-top: 32px;">
                    <button type="button" class="btn btn-primary" style="background: var(--accent-blue);">Publish
                        Internship</button>
                    <button type="button" class="btn btn-outline">Save as Draft</button>
                </div>
            </form>
        </main>
    </div>
    <script>
        // Configuration: Change this to your server IP if not accessing via http
        const BACKEND_URL = window.location.protocol === 'file:' ? 'http://10.225.202.159:5000' : '';

        document.addEventListener('DOMContentLoaded', () => {
            const admin = JSON.parse(localStorage.getItem('admin'));
            if (!admin) {
                window.location.href = 'admin-login.html';
                return;
            }
        });

        async function publishInternship() {
            const data = {
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                work_type: document.getElementById('work_mode').value,
                duration: document.getElementById('duration').value,
                stipend: document.getElementById('stipend').value,
                location: document.getElementById('location').value,
                skills: document.getElementById('skills').value,
                deadline: document.getElementById('deadline').value,
                description: document.getElementById('description').value
            };

            if (!data.title || !data.company || !data.skills || !data.deadline || !data.description) {
                alert('Please fill in all required fields.');
                return;
            }

            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;

            try {
                btn.innerText = 'Publishing...';
                btn.disabled = true;

                const response = await fetch(`${BACKEND_URL}/create_internship`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Internship Published Successfully!');
                    window.location.href = 'admin-manage-internships.html';
                } else {
                    const result = await response.json();
                    alert(result.error || 'Failed to publish internship');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // Attach event listener
        document.querySelector('.btn-primary').onclick = publishInternship;
    </script>
</body>

</html>

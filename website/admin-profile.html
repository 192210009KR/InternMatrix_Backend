<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - InternMatrix</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .admin-sidebar {
            background: var(--white);
            border-right: 1.5px solid var(--border-color);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 48px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .admin-nav-item:hover {
            background: var(--secondary-blue);
            color: var(--primary-blue);
            transform: translateX(4px);
        }

        .admin-nav-item.active {
            background: var(--primary-blue);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(0, 149, 217, 0.2);
        }

        /* Sidebar override to avoid global nav conflict */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        
        /* Sidebar nav override */
        .admin-sidebar .sidebar-nav {
            margin-top: 12px;
        }
        
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Override global nav style for sidebar */
        .admin-sidebar nav {
            height: auto;
            flex-direction: column;
            align-items: flex-start;
            padding: 0;
            background: transparent;
            box-shadow: none;
            position: static;
        }

        .admin-content {
            padding: 48px 64px;
            background: var(--bg-light);
            max-width: 1000px;
        }

        .profile-card {
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            border: 1px solid rgba(0, 149, 217, 0.05);
        }

        .avatar-circle {
            width: 110px;
            height: 110px;
            background: var(--primary-blue);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            margin: 0 auto;
            box-shadow: 0 12px 24px rgba(0, 149, 217, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 24px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-pill);
            font-size: 15px;
            background: var(--white);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(0, 149, 217, 0.1);
        }

        @media (max-width: 1024px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="index.html" class="logo" style="color: var(--primary-blue);">InternMatrix <span
                    style="font-size: 12px; opacity: 0.6; font-weight: 400; color: var(--text-secondary);">ADMIN</span></a>
            <div class="sidebar-nav">
                <a href="admin-dashboard.html" class="admin-nav-item"><i>🏠</i> Dashboard</a>
                <a href="admin-create-internship.html" class="admin-nav-item"><i>➕</i> Create Internship</a>
                <a href="admin-manage-internships.html" class="admin-nav-item"><i>📂</i> Manage Internships</a>
                <a href="admin-applications.html" class="admin-nav-item"><i>👥</i> All Applications</a>
                <a href="admin-profile.html" class="admin-nav-item active"><i>👤</i> My Profile</a>
            </div>
        </aside>

        <main class="admin-content">
            <h2 style="font-family: 'Outfit'; font-size: 32px; margin-bottom: 32px;">Admin Account Settings</h2>

            <section class="card profile-card">
                <div class="avatar-circle">RK</div>

                <div style="text-align: center; margin-bottom: 8px;">
                    <h3 style="font-size: 24px;">Rajesh Kumar</h3>
                    <p style="color: var(--text-secondary); font-size: 14px;">Senior Recruitment Administrator</p>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>FULL NAME</label>
                        <input type="text" value="Rajesh Kumar">
                    </div>
                    <div class="form-group">
                        <label>ADMIN EMAIL</label>
                        <input type="email" value="rajesh@simats.com" disabled
                            style="background: #F1F1F1; cursor: not-allowed;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>DEPARTMENT</label>
                        <input type="text" value="Recruitment & Training">
                    </div>
                    <div class="form-group">
                        <label>OFFICE LOCATION</label>
                        <input type="text" value="Chennai - Main Campus">
                    </div>
                </div>

                <div class="form-group">
                    <label>BIOGRAPHY</label>
                    <textarea
                        style="width: 100%; height: 120px; border-radius: 12px; border: 1.5px solid var(--border-color); padding: 14px; font-size: 15px; font-family: inherit;">Managing the university's internship outreach and corporate relations for the past 5 years. Dedicated to finding the best opportunities for our students.</textarea>
                </div>

                <div style="display: flex; gap: 16px; margin-top: 16px;">
                    <button class="btn btn-primary" style="background: var(--accent-blue);">Save Changes</button>
                    <button class="btn btn-outline">Change Password</button>
                </div>
            </section>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const admin = JSON.parse(localStorage.getItem('admin'));
            if (!admin) {
                window.location.href = 'admin-login.html';
                return;
            }

            // Populate Admin UI
            document.querySelector('.avatar-circle').innerText = admin.username[0].toUpperCase();
            document.querySelector('.profile-card h3').innerText = admin.username;
            document.querySelectorAll('.form-group input')[0].value = admin.username;
            document.querySelectorAll('.form-group input')[1].value = admin.email || 'admin@simats.com';
        });

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('admin');
            window.location.href = 'index.html';
        }

        // Attach logout to all logout links
        document.querySelectorAll('a[href="index.html"]').forEach(link => {
            if (link.innerText.includes('Logout') || link.innerText.includes('Sign Out')) {
                link.onclick = (e) => {
                    e.preventDefault();
                    logout();
                };
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now - InternMatrix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .apply-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .apply-card {
            padding: 40px;
            animation: fadeIn 0.8s ease;
        }

        .form-section-title {
            font-size: 20px;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 24px;
            color: var(--primary-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-color);
            font-size: 15px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .internship-summary {
            background: var(--secondary-blue);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="student-dashboard.html" class="logo">InternMatrix</a>
        <div class="nav-links">
            <a href="student-dashboard.html" class="btn btn-outline">Cancel</a>
            <a href="student-profile.html" id="profile-btn" style="width: 44px; height: 44px; border-radius: 50%; background: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none; overflow: hidden; font-size: 16px; font-family: 'Outfit', sans-serif;">
                <span id="profile-initials">U</span>
                <img id="profile-image" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            </a>
        </div>
    </nav>

    <main class="apply-container">
        <section class="card apply-card">
            <div class="internship-summary">
                <div class="brand-logo"
                    style="width: 64px; height: 64px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--primary-blue);">
                    ?</div>
                <div>
                    <h3 style="font-family: 'Outfit';">Loading Internship...</h3>
                    <p style="color: var(--primary-blue); font-weight: 700;">Please wait...</p>
                </div>
            </div>

            <form onsubmit="submitApplication(event)">
                <div class="form-section-title">Personal Information</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="+91 98765 43210" required>
                    </div>
                    <div class="form-group">
                        <label>LinkedIn Profile</label>
                        <input type="url" class="form-control" id="linkedin"
                            placeholder="https://linkedin.com/in/username">
                    </div>
                </div>

                <div class="form-section-title">Education & Skills</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>College/University</label>
                        <input type="text" class="form-control" id="college" required>
                    </div>
                    <div class="form-group">
                        <label>Current GPA</label>
                        <input type="text" class="form-control" id="cgpa" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 32px;">
                    <label>Why are you interested in this role?</label>
                    <textarea class="form-control" id="coverLetter" style="height: 120px;"
                        placeholder="Briefly describe your motivation..." required></textarea>
                </div>

                <div class="form-section-title">Resume Upload</div>
                <div class="form-group" style="margin-bottom: 40px;">
                    <div style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; border-radius: var(--radius-md); cursor: pointer;"
                        onclick="handleFileUpload()">
                        <span style="font-size: 40px; display: block; margin-bottom: 12px;">📄</span>
                        <p id="fileName" style="font-weight: 700;">Click to upload or drag and drop</p>
                        <p style="font-size: 13px; color: var(--text-secondary);">PDF, DOCX (Max 5MB)</p>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center; height: 56px; font-size: 18px;">
                    Submit Application
                </button>
            </form>
        </section>
    </main>

    <script>
        // Configuration: Change this to your server IP if not accessing via http
        const BACKEND_URL = window.location.protocol === 'file:' ? 'http://10.225.202.159:5000' : '';

        let selectedFile = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'student-login.html';
                return;
            }

            // Update Header Profile Picture
            const initials = document.getElementById('profile-initials');
            const img = document.getElementById('profile-image');

            if (user && user.profile_pic) {
                img.src = user.profile_pic;
                img.style.display = 'block';
                initials.style.display = 'none';
            } else if (user && user.full_name) {
                initials.innerText = user.full_name[0].toUpperCase();
            }

            // Pre-fill user data
            document.getElementById('fullName').value = user.full_name || '';
            document.getElementById('email').value = user.email || '';

            // Fetch Internship Details for summary
            const urlParams = new URLSearchParams(window.location.search);
            const internId = urlParams.get('id');

            if (internId) {
                try {
                    const response = await fetch(`${BACKEND_URL}/get_internship/${internId}`);
                    const intern = await response.json();
                    if (response.ok) {
                        document.querySelector('.internship-summary h3').innerText = `Applying for: ${intern.title}`;
                        document.querySelector('.internship-summary p').innerText = `${intern.company} • ${intern.location}`;
                        document.querySelector('.brand-logo').innerText = intern.company[0];
                    }
                } catch (err) {
                    console.error('Error fetching internship details:', err);
                }
            }
        });

        function handleFileUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.docx';
            input.onchange = (e) => {
                selectedFile = e.target.files[0];
                if (selectedFile) {
                    document.getElementById('fileName').innerText = `Selected: ${selectedFile.name}`;
                }
            };
            input.click();
        }

        async function submitApplication(e) {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('user'));
            const urlParams = new URLSearchParams(window.location.search);
            const internId = urlParams.get('id');

            if (!internId) {
                alert('No internship selected');
                return;
            }

            const formData = new FormData();
            formData.append('user_id', user.id);
            formData.append('internship_id', internId);
            formData.append('full_name', document.getElementById('fullName').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('college', document.getElementById('college').value);
            formData.append('cgpa', document.getElementById('cgpa').value);
            formData.append('cover_letter', document.getElementById('coverLetter').value);

            if (selectedFile) {
                formData.append('file', selectedFile);
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;

            try {
                btn.innerText = 'Submitting...';
                btn.disabled = true;

                const response = await fetch(`${BACKEND_URL}/apply_internship`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Application Submitted Successfully!');
                    window.location.href = 'student-applications.html';
                } else {
                    alert(data.error || 'Submission failed');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred during submission.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>

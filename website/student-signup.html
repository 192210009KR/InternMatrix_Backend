<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up - InternMatrix</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .step-indicator {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            background: var(--border-color);
        }
        .step-dot.active {
            width: 24px;
            border-radius: 4px;
            background: var(--primary-blue);
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html" class="logo">InternMatrix</a>
        <div class="nav-links">
            <a href="index.html" class="btn btn-outline" style="font-size: 14px;">Back to Home</a>
        </div>
    </nav>

    <main class="auth-container">
        <section class="card auth-card">
            <div class="auth-header">
                <h2>Join InternMatrix Today</h2>
                <p id="stepDescription">Step 1: Verify your student email to continue.</p>
            </div>

            <div class="step-indicator">
                <div id="dot1" class="step-dot active"></div>
                <div id="dot2" class="step-dot"></div>
            </div>

            <!-- Step 1: Email Verification -->
            <div id="step1">
                <div class="form-group">
                    <label for="email">Student Email</label>
                    <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                </div>
                
                <div id="otpSection" class="hidden">
                    <div class="form-group">
                        <label for="otp">Verification Code (OTP)</label>
                        <input type="text" id="otp" class="form-control" placeholder="Enter 6-digit code" maxlength="6">
                    </div>
                </div>

                <button id="sendOtpBtn" onclick="sendOtp()" class="btn btn-primary" style="width: 100%; justify-content: center; height: 56px;">
                    Send Verification Code
                </button>
                <button id="verifyOtpBtn" onclick="verifyOtp()" class="btn btn-primary hidden" style="width: 100%; justify-content: center; height: 56px;">
                    Verify & Continue
                </button>
            </div>

            <!-- Step 2: Profile Details -->
            <div id="step2" class="hidden">
                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                            <span class="toggle-password" onclick="toggleConfirmPassword()">👁️</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 56px; font-size: 16px;">
                        Create Account
                    </button>
                </form>
            </div>

            <div style="margin-top: 24px; text-align: center; font-size: 15px; color: var(--text-secondary);">
                Already have an account?
                <a href="student-login.html" style="color: var(--primary-blue); font-weight: 700; text-decoration: none;">Log In</a>
            </div>
        </section>
    </main>

    <script>
        // Configuration: Change this to your server IP if not accessing via http
        const BACKEND_URL = window.location.protocol === 'file:' ? 'http://10.225.202.159:5000' : '';
        let verifiedOtp = "";

        function togglePassword(id) {
            const pwd = document.getElementById(id);
            const toggle = pwd.nextElementSibling;
            if (pwd.type === 'password') {
                pwd.type = 'text';
                toggle.innerText = '🔒';
            } else {
                pwd.type = 'password';
                toggle.innerText = '👁️';
            }
        }

        function toggleConfirmPassword() {
            togglePassword('confirmPassword');
        }

        async function sendOtp() {
            const email = document.getElementById('email').value;
            if (!email) { alert('Please enter email'); return; }
            
            const btn = document.getElementById('sendOtpBtn');
            try {
                btn.disabled = true;
                btn.innerText = 'Sending...';
                const res = await fetch(`${BACKEND_URL}/send_signup_otp`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('OTP sent to your email!');
                    document.getElementById('otpSection').classList.remove('hidden');
                    document.getElementById('sendOtpBtn').classList.add('hidden');
                    document.getElementById('verifyOtpBtn').classList.remove('hidden');
                } else { alert(data.error || 'Failed to send OTP'); }
            } catch (err) { alert('Connection error'); }
            finally { btn.disabled = false; btn.innerText = 'Resend Code'; }
        }

        async function verifyOtp() {
            const email = document.getElementById('email').value;
            const otpCode = document.getElementById('otp').value;
            if (!otpCode) { alert('Please enter OTP'); return; }

            const btn = document.getElementById('verifyOtpBtn');
            try {
                btn.disabled = true;
                btn.innerText = 'Verifying...';
                const res = await fetch(`${BACKEND_URL}/verify_signup_otp`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, otp: otpCode })
                });
                const data = await res.json();
                if (res.ok) {
                    verifiedOtp = otpCode;
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    document.getElementById('dot1').classList.remove('active');
                    document.getElementById('dot2').classList.add('active');
                    document.getElementById('stepDescription').innerText = 'Step 2: Complete your profile details.';
                } else { alert(data.error || 'Invalid OTP'); }
            } catch (err) { alert('Connection error'); }
            finally { btn.disabled = false; btn.innerText = 'Verify & Continue'; }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) { alert('Passwords do not match'); return; }
            if (password.length < 6) { alert('Password must be at least 6 characters'); return; }

            const btn = e.target.querySelector('button');
            try {
                btn.disabled = true;
                btn.innerText = 'Creating Account...';
                const res = await fetch(`${BACKEND_URL}/signup`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        full_name: fullName, 
                        email: email, 
                        password: password,
                        otp: verifiedOtp
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Account created! Logging you in...');
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'student-dashboard.html';
                } else { alert(data.error || 'Signup failed'); }
            } catch (err) { alert('Connection error'); }
            finally { btn.disabled = false; btn.innerText = 'Create Account'; }
        }
    </script>
</body>

</html>
